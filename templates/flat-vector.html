<!DOCTYPE html>
<!--
  Lumina Card · 测试版 flat-vector（有限色系矢量扁平）风格版式
  有限色系 / 无轮廓 / 矢量扁平 / 留白 / 居中构图。现代插画艺术画册风。
  使用方式：
    1) 把 {{IMAGE}} 换成矢量扁平底图文件名（与本 html 同目录）
    2) 把 {{EYEBROW}} {{TITLE}} {{EN}} {{SUB}} 换成文案
    3) 用浏览器打开 / 截图 / 打印（@page 已设 A5）
  配色：底 #F5F2EC · 卡片 #FBF9F4 · 深墨绿 #3A4A43 · 陶土橙 #C97B4A · 灰 #A8A29A
  底图要求：有限色系扁平矢量底图（3-4 色、无轮廓、纯扁平、留白、居中），由 ImageGen 在 color 阶段生成。
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}} · 明信片</title>
<style>
  @page { size: A5; margin: 0; }
  body {
    margin: 0;
    background: #F5F2EC;
    display: flex;
    justify-content: center;
    padding: 24px;
    font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .postcard {
    width: 600px;
    min-height: 848px;
    background: #FBF9F4;
    color: #3A4A43;
    padding: 52px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  /* 小色块印章：呼应矢量色块，克制点缀 */
  .swatch {
    position: absolute;
    width: 12px; height: 12px;
    background: #C97B4A;
    border-radius: 2px;
    top: 48px; right: 58px;
    opacity: 0.85;
  }
  .swatch2 {
    position: absolute;
    width: 8px; height: 8px;
    background: #3A4A43;
    border-radius: 50%;
    bottom: 110px; left: 60px;
    opacity: 0.5;
  }
  .eyebrow {
    position: relative;
    z-index: 1;
    font-size: 10px;
    letter-spacing: 6px;
    color: #A8A29A;
    margin-bottom: 40px;
    font-weight: 600;
  }
  .photo {
    position: relative;
    z-index: 1;
    width: 86%;
    display: block;
  }
  .caption {
    position: relative;
    z-index: 1;
    margin-top: 44px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .title {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 12px;
    line-height: 1.25;
    color: #3A4A43;
  }
  .en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #A8A29A;
    margin-top: 16px;
  }
  .sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: #A8A29A;
    margin-top: 18px;
    line-height: 1.7;
  }
  /* Lumina Card 品牌签名：独立叠加层，右下安全角，低调可读，不压主体/不抢标题 */
  .lumina-brandmark {
    position: absolute;
    z-index: 5;
    right: 30px;
    bottom: 22px;
    width: 108px;
    height: auto;
    opacity: .42;
    mix-blend-mode: multiply;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div class="postcard">
    <div class="swatch"></div>
    <div class="swatch2"></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <img class="photo" src="{{IMAGE}}" alt="{{TITLE}}">
    <div class="caption">
      <div class="title">{{TITLE}}</div>
      <div class="en">{{EN}}</div>
      <div class="sub">{{SUB}}</div>
    </div>
    <img class="lumina-brandmark" src="{{BRANDMARK}}" alt="">
  </div>
</body>
</html>
