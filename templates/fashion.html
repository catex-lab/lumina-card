<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Card · Fashion Editorial</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F4EE;
      --text-main: #3C3834;
      --text-sub: #7D7770;
      --accent: #B8A888;
      --card-bg: rgba(255, 253, 248, 0.78);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #EAE7E0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .card {
      width: 900px;
      height: 1100px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.10);
    }
    .image-layer {
      position: absolute;
      inset: 0;
      background-image: url("{{IMAGE}}");
      background-size: cover;
      background-position: center 70%;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(247,244,238,0.0) 0%, rgba(247,244,238,0.0) 55%, rgba(247,244,238,0.35) 78%, rgba(247,244,238,0.92) 100%);
    }
    .accent-line {
      position: absolute;
      top: 64px;
      right: 64px;
      width: 48px;
      height: 1px;
      background: var(--accent);
    }
    .accent-line::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    .text-card {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 96px;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      padding: 52px 60px 48px;
      text-align: center;
      border: 1px solid rgba(184,168,136,0.35);
    }
    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 22px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      font-weight: 500;
      line-height: 1.10;
      color: var(--text-main);
      margin-bottom: 18px;
    }
    .en {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      color: var(--text-sub);
      margin-bottom: 30px;
      letter-spacing: 0.02em;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto 26px;
    }
    .sub {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }
    .lumina-brandmark {
      position: absolute;
      z-index: 6;
      right: 48px;
      bottom: 40px;
      width: 128px;
      height: auto;
      opacity: .42;
      mix-blend-mode: multiply;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="image-layer"></div>
    <div class="vignette"></div>
    <div class="accent-line"></div>
    <div class="text-card">
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="title">{{TITLE}}</div>
      <div class="en">{{EN}}</div>
      <div class="divider"></div>
      <div class="sub">{{SUB}}</div>
    </div>
    <img class="lumina-brandmark" src="{{BRANDMARK}}" alt="">
  </div>
</body>
</html>
