<!DOCTYPE html>
<!--
  Postcard Studio · 内置 silhouette 风格版式（成品级）
  双色剪影 / 厚重扁平造型：暖米底 + 大留白 + 粗黑标题，极简无框。
  使用方式：
    1) 把 {{IMAGE}} 换成双色剪影底图文件名（与本 html 同目录）
    2) 把 {{EYEBROW}} {{TITLE}} {{EN}} {{SUB}} 换成文案
    3) 用浏览器打开 / 截图 / 打印（@page 已设 A5）
  配色：底 #F2EFE8 · 文字 #2A2A2A · 灰阶 #7A7A7A / #5A5A5A / #8A8A8A
  底图要求：双色 duotone 剪影（单一深色 + 纯色浅底，无渐变），由 ImageGen 在 color 阶段生成。
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}} · 明信片</title>
<style>
  @page { size: A5; margin: 0; }
  body {
    margin: 0;
    background: #e4e1da;
    display: flex;
    justify-content: center;
    padding: 24px;
    font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .postcard {
    width: 600px;
    background: #F2EFE8;
    color: #2A2A2A;
    padding: 32px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 5px;
    color: #7A7A7A;
    margin-bottom: 28px;
  }
  .photo {
    width: 100%;
    display: block;
  }
  .caption {
    margin-top: 32px;
  }
  .title {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 14px;
    line-height: 1;
  }
  .en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #5A5A5A;
    margin-top: 12px;
  }
  .sub {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8A8A8A;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="postcard">
    <div class="eyebrow">{{EYEBROW}}</div>
    <img class="photo" src="{{IMAGE}}" alt="{{TITLE}}">
    <div class="caption">
      <div class="title">{{TITLE}}</div>
      <div class="en">{{EN}}</div>
      <div class="sub">{{SUB}}</div>
    </div>
  </div>
</body>
</html>
