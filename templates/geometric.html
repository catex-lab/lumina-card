<!DOCTYPE html>
<!--
  Lumina Card · 测试版 geometric（极简抽象几何）风格版式
  几何形状 / 有限色系 / 无轮廓 / 矢量扁平 / 极度留白 / 居中构图。
  使用方式：
    1) 把 {{IMAGE}} 换成抽象几何底图文件名（与本 html 同目录）
    2) 把 {{EYEBROW}} {{TITLE}} {{EN}} {{SUB}} 换成文案
    3) 用浏览器打开 / 截图 / 打印（@page 已设 A5）
  配色：底 #F4F2EC · 卡片 #FAF8F3 · 墨蓝 #2B3852 · 赭橙 #C96F2E · 灰 #A09A8E
  底图要求：极简抽象几何底图（有限色系、无轮廓、矢量扁平、大留白、居中），由 ImageGen 在 color 阶段生成。
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}} · 明信片</title>
<style>
  @page { size: A5; margin: 0; }
  body {
    margin: 0;
    background: #F4F2EC;
    display: flex;
    justify-content: center;
    padding: 24px;
    font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .postcard {
    width: 600px;
    min-height: 848px;
    background: #FAF8F3;
    color: #2B3852;
    padding: 44px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  /* 几何装饰：细线框 + 角标 + 点 */
  .geo-frame {
    position: absolute;
    top: 26px; left: 26px; right: 26px; bottom: 26px;
    border: 1px solid #E3DFD5;
    pointer-events: none;
  }
  .geo-corner {
    position: absolute;
    width: 14px; height: 14px;
    border: 1.5px solid #C96F2E;
  }
  .c-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .c-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .c-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .c-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
  .geo-dot {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #C96F2E;
    opacity: 0.8;
  }
  .d-a { top: 40px; left: 50%; transform: translateX(-50%); }
  .d-b { bottom: 90px; right: 56px; }
  .d-c { bottom: 90px; left: 56px; }
  .eyebrow {
    position: relative;
    z-index: 1;
    font-size: 10px;
    letter-spacing: 6px;
    color: #A09A8E;
    margin-bottom: 34px;
    font-weight: 600;
  }
  .photo {
    position: relative;
    z-index: 1;
    width: 88%;
    display: block;
  }
  .caption {
    position: relative;
    z-index: 1;
    margin-top: 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 10px;
    line-height: 1.2;
    color: #2B3852;
  }
  .en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #A09A8E;
    margin-top: 14px;
  }
  .sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: #A09A8E;
    margin-top: 16px;
    line-height: 1.7;
  }
  .rule {
    width: 34px;
    height: 2px;
    background: #C96F2E;
    margin: 20px auto 0;
  }
  /* 用户签名：独立叠加层，右下安全角，低调可读，不压主体/不抢标题 */
  .lumina-brandmark {
    position: absolute;
    z-index: 5;
    right: 30px;
    bottom: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: .42;
    mix-blend-mode: multiply;
    pointer-events: none;
    user-select: none;
    font-family: Georgia, "Times New Roman", "Source Han Sans SC", "PingFang SC", sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #2B3852;
  }
  .lumina-brandmark img { width: 16px; height: 16px; display: block; }
</style>
</head>
<body>
  <div class="postcard">
    <div class="geo-frame"></div>
    <div class="geo-corner c-tl"></div>
    <div class="geo-corner c-tr"></div>
    <div class="geo-corner c-bl"></div>
    <div class="geo-corner c-br"></div>
    <div class="geo-dot d-a"></div>
    <div class="geo-dot d-b"></div>
    <div class="geo-dot d-c"></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <img class="photo" src="{{IMAGE}}" alt="{{TITLE}}">
    <div class="caption">
      <div class="title">{{TITLE}}</div>
      <div class="en">{{EN}}</div>
      <div class="sub">{{SUB}}</div>
      <div class="rule"></div>
    </div>
    <div class="lumina-brandmark">
      <img src="{{BRANDMARK}}" alt="">
      <span class="brandmark-text">{{SIGNATURE}}</span>
    </div>
  </div>
</body>
</html>
